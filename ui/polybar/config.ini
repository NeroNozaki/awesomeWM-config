[colors]
background = #CC1C1C1C
background-alt = #333333
foreground = #D4D4D4
primary = #E05260
secondary = #DDBB55
alert = #E6B800
disabled = #929292



[bar/example]
width = 100%
height = 24pt
radius = 6

# dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 2pt
border-color = #CC000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

# font-0 = monospace;2
font-0 = Roboto:size=14;2
font-1 = RecMonoCasual Nerd Font;2
font-2 = RecMonoCasual Nerd Font:size=18;2
font-3 = Material Icons;2

modules-left = void xworkspaces xkeyboard 
modules-center =
modules-right = battery customaudio memory cpu systray date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true


[module/powermenu]
type = custom/menu
expand-right = true

format-spacing =

label-open = "⏻ "
label-open-foreground = ${colors.secondary}
label-close =  cancel
label-close-foreground = ${colors.secondary}
label-separator = |
label-separator-foreground = ${colors.foreground-alt}

menu-0-0 = doas reboot
menu-0-0-exec = menu-open-1
menu-0-1 = power off
menu-0-1-exec = menu-open-2

menu-1-0 = cancel
menu-1-0-exec = menu-open-0
menu-1-1 = doas reboot
menu-1-1-exec = doas reboot

menu-2-0 = power off
menu-2-0-exec = doas poweroff
menu-2-1 = cancel
menu-2-1-exec = menu-open-0

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

; Charging: separate icon and percentage
format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%
label-charging-font = 1
label-charging-foreground = #D4D4D4

animation-charging-0 = 󰂄
animation-charging-font = 3
animation-charging-foreground = #75B88A

; Discharging: separate battery icon and percentage
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-font = 1
label-discharging-foreground = #D4D4D4

; Full: same separation
format-full = <ramp-capacity> <label-full>
label-full = %percentage%%
label-full-font = 1
label-full-foreground = #D4D4D4

; Battery-level icons
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹

ramp-capacity-font = 3
ramp-capacity-0-foreground = ${colors.primary}
ramp-capacity-1-foreground = ${colors.primary}
ramp-capacity-2-foreground = ${colors.secondary}
ramp-capacity-3-foreground = ${colors.secondary}
ramp-capacity-4-foreground = #75B88A
ramp-capacity-5-foreground = #75B88A
ramp-capacity-6-foreground = #75B88A
ramp-capacity-7-foreground = #75B88A
ramp-capacity-8-foreground = #75B88A
ramp-capacity-9-foreground = #75B88A

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

# ============================

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/taglist]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /
mount-1 = /mnt/HD

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
click-right = "flatpak run com.saivert.pwvucontrol"

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 󰝟
label-muted-foreground = ${colors.disabled}

[module/customaudio]
type = custom/script
exec = ~/.config/awesome/ui/polybar/scripts/volume.sh
interval = 1
tail = true

label = %output%

click-left = flatpak run com.saivert.pwvucontrol &
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/ethernet]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/void]
type = custom/text
content ="  "
content-font = 3

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
